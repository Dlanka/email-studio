<!-- Production HTML Email Signature Snippet -->
<!-- Self-contained table-based layout compatible with Gmail, Outlook, Apple Mail -->
<link
  href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap"
  rel="stylesheet"
/>

<table class="sig-root" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td
      class="sig-profile-pic"
      background="{{attr profilePicUrl}}"
      style="background-image: url('{{attr profilePicUrl}}')"
    >
      <table class="sig-container" cellpadding="0" cellspacing="0" border="0">
        <!-- Top -->
        <tr>
          <td class="sig-top">
            <table class="sig-tb-inner" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td>
                  <img class="sig-signature" src="{{attr signature}}" alt="Signature" width="140" />
                  <div class="sig-job-title">{{jobTitle}}</div>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Bottom -->
        <tr>
          <td class="sig-bottom-td">
            <table class="sig-tb-inner sig-tb-bottom" cellpadding="0" cellspacing="0" border="0">
              <!-- Email -->
              <tr>
                <td class="info-td" valign="middle">
                  <img class="sig-icon" src="{{attr iconEmail}}" alt="Email Icon" width="14" />
                </td>
                <td class="info-td" valign="middle">
                  <a class="sig-info-text" href="mailto:{{email}}">{{email}}</a>
                </td>
              </tr>

              <!-- Website -->
              <tr>
                <td class="info-td" valign="middle">
                  <img class="sig-icon" src="{{attr iconWebLink}}" alt="Email Icon" width="14" />
                </td>
                <td class="info-td" valign="middle">
                  <a
                    class="sig-info-text"
                    href="{{attr websiteUrl}}"
                    target="_blank"
                    rel="noopener noreferrer"
                    >{{websiteLabel}}</a
                  >
                </td>
              </tr>

              <!-- Phone -->
              <tr>
                <td class="info-td" valign="middle">
                  <img class="sig-icon" src="{{attr iconPhone}}" alt="Phone Icon" width="14" />
                </td>
                <td class="info-td" valign="middle">
                  <a class="sig-info-text" href="tel:{{phone}}">{{phone}}</a>
                </td>
              </tr>

              <!-- Address -->
              <tr>
                <td class="info-td" valign="middle">
                  <img class="sig-icon" src="{{attr iconLocation}}" alt="Address Icon" width="14" />
                </td>
                <td class="info-td" valign="middle">
                  <div class="sig-info-text">{{address}}</div>
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
